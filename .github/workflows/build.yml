# Upload this file + scripts/build.py + scripts/test.py to an otherwise empty repository.
# Two official upstream heads are compared to the most recent complete published Release.
# On no changes, neither a Docker build nor a new Release occurs.
name: twp-build

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/build.py'
      - 'scripts/test.py'
  schedule:
    # 20:23 UTC = 04:23 next day China Standard Time.
    - cron: '23 20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even when both official upstream commits are unchanged'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: tg-webproxy-aio-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      build_needed: ${{ steps.upstream.outputs.build_needed }}
      plan_json: ${{ steps.upstream.outputs.plan_json }}
    steps:
      - name: Check out the three-file repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore SHA256-verified embedded build sources
        run: python3 scripts/build.py restore
      - name: Compare official upstream heads with last complete Release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force && 'true' || 'false' }}
        run: |
          python3 scripts/build.py detect \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --force "$FORCE_BUILD"

  build:
    needs: detect
    if: needs.detect.outputs.build_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out the same wrapper revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore SHA256-verified build sources
        run: python3 scripts/build.py restore
      - name: Restore the detected commit plan (no moving-branch resolution)
        env:
          RELEASE_PLAN: ${{ needs.detect.outputs.plan_json }}
        run: python3 scripts/build.py write-plan
      - name: Test source bundle and Release decision logic
        run: python3 scripts/test.py unit
      - name: Fetch exact official commits and save pristine source archive
        run: python3 scripts/build.py prepare
      - name: Compile and test single linux/amd64 Docker image
        run: python3 scripts/build.py image
      - name: Test real container startup, persistence, logs and HTTP relay
        run: python3 scripts/test.py smoke
      - name: Package the verified Docker image and calculate digests
        run: python3 scripts/build.py package
      - name: Check all four internal transfer files before upload
        run: |
          set -euo pipefail
          dist=tg-aio-work/project/dist
          for file in release.json release-body.md twp-sources.tar.gz twp-amd64.tar.gz; do
            if [ ! -s "$dist/$file" ]; then
              echo "::error::Missing or empty build output: $dist/$file"
              exit 1
            fi
          done
          ls -lh "$dist"/release.json "$dist"/release-body.md "$dist"/twp-*.tar.gz
      - name: Upload tested bundle to the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: twp-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tg-aio-work/project/dist/release.json
            tg-aio-work/project/dist/release-body.md
            tg-aio-work/project/dist/twp-sources.tar.gz
            tg-aio-work/project/dist/twp-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.build_needed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out trusted release driver
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore SHA256-verified release helper
        run: python3 scripts/build.py restore
      - name: Download this run's tested bundle by its exact name
        uses: actions/download-artifact@v4
        with:
          # A named single artifact is extracted directly into `path`.
          # Do not use an empty artifact-ids input: it downloads all artifacts
          # and creates an extra subdirectory, hiding dist/release.json.
          name: twp-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: tg-aio-work/project/dist/
      - name: Check downloaded bundle layout before publishing
        run: |
          set -euo pipefail
          dist=tg-aio-work/project/dist
          echo "Downloaded transfer files:"
          find "$dist" -maxdepth 2 -type f -printf '%P (%s bytes)\n' | sort
          for file in release.json release-body.md twp-sources.tar.gz twp-amd64.tar.gz; do
            if [ ! -s "$dist/$file" ]; then
              echo "::error::Missing or empty downloaded file: $dist/$file"
              exit 1
            fi
          done
      - name: Verify asset hashes and publish exactly two Release attachments
        env:
          GH_TOKEN: ${{ github.token }}
          DETECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/build.py publish \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$DETECTED_RUN_ATTEMPT"
