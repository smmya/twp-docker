# Only these three files are needed in the repository.
# Upstream detection is read-only; built assets go directly to GitHub Releases.
name: Telegram WEB Proxy AIO - official upstream watcher

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/build.py'
      - 'scripts/test.py'
  schedule:
    # 20:23 UTC = 04:23 next day China Standard Time.
    - cron: '23 20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even when both upstream commits are unchanged'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: twp-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      build_needed: ${{ steps.upstream.outputs.build_needed }}
      plan_json: ${{ steps.upstream.outputs.plan_json }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore embedded build code
        run: python3 scripts/build.py restore
      - name: Compare upstream commits
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force && 'true' || 'false' }}
        run: |
          python3 scripts/build.py detect \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --force "$FORCE_BUILD"

  build_publish:
    needs: detect
    if: needs.detect.outputs.build_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore embedded build code
        run: python3 scripts/build.py restore
      - name: Restore fixed commit plan
        env:
          RELEASE_PLAN: ${{ needs.detect.outputs.plan_json }}
        run: python3 scripts/build.py write-plan
      - name: Run unit tests
        run: python3 scripts/test.py unit
      - name: Fetch exact upstream revisions
        run: python3 scripts/build.py prepare
      - name: Build Docker image (linux/amd64)
        run: python3 scripts/build.py image
      - name: Run container tests
        run: python3 scripts/test.py smoke
      - name: Package two release assets
        run: python3 scripts/build.py package
      - name: Verify local release assets
        run: |
          set -euo pipefail
          dist=tg-aio-work/project/dist
          for file in release.json release-body.md twp-sources.tar.gz twp-amd64.tar.gz; do
            if [ ! -s "$dist/$file" ]; then
              echo "::error::Missing or empty release file: $dist/$file"
              exit 1
            fi
          done
          (cd "$dist" && sha256sum twp-sources.tar.gz twp-amd64.tar.gz)
      - name: Publish directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/build.py publish \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
